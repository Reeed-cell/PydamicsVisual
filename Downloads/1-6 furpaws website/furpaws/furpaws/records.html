<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Records — Furpaws Veterinary Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="staff.css">
<link rel="stylesheet" href="records.css">
</head>
<body class="dashboard-body">

<header class="dash-header">
  <div class="wrap dash-header-inner">
    <a href="index.html" class="login-brand">
      <img src="logo.png" alt="1-6 Fur-paws Veterinary Clinic">
      <span>Furpaws<em>Staff</em></span>
    </a>
    <div class="dash-header-right">
      <a href="dashboard.html" class="records-nav-link">← Dashboard</a>
      <span id="dash-user-label" class="dash-user-label">…</span>
      <button class="btn btn-ghost" id="logout-btn">Sign out</button>
    </div>
  </div>
</header>

<main class="wrap dash-main">

  <div id="loading-state" class="dash-loading">Loading…</div>
  <section id="no-access-view" class="dash-view" hidden>
    <div class="dash-view-head">
      <h1>You don't have access to this page.</h1>
      <p class="dash-view-sub">Records are visible to vets and receptionists once you're signed in with the right role.</p>
    </div>
  </section>

  <section id="records-view" class="dash-view" hidden>

    <!-- Search / pet list -->
    <div class="dash-view-head">
      <h1>Records</h1>
      <p class="dash-view-sub">Search for a pet, or add a new profile.</p>
    </div>

    <div class="records-search-row">
      <input type="text" id="pet-search" placeholder="Search by pet or owner name…">
      <button class="btn btn-primary" id="new-pet-btn">+ New pet</button>
    </div>

    <div id="pets-list" class="pets-list"></div>
    <p id="pets-empty" class="dash-empty" hidden>No pets found.</p>

    <!-- New pet form (hidden by default) -->
    <div id="new-pet-form-wrap" class="record-panel" hidden>
      <h2>New pet profile</h2>
      <form id="new-pet-form">
        <div class="form-row-grid">
          <div class="form-row">
            <label for="pet-name">Pet name</label>
            <input type="text" id="pet-name" required>
          </div>
          <div class="form-row">
            <label for="pet-species">Species</label>
            <input type="text" id="pet-species" required>
          </div>
          <div class="form-row">
            <label for="pet-breed">Breed <span class="optional">(optional)</span></label>
            <input type="text" id="pet-breed">
          </div>
          <div class="form-row">
            <label for="pet-birthdate">Birthdate <span class="optional">(optional)</span></label>
            <input type="date" id="pet-birthdate">
          </div>
          <div class="form-row">
            <label for="pet-weight">Weight (kg) <span class="optional">(optional)</span></label>
            <input type="number" step="0.1" id="pet-weight">
          </div>
          <div class="form-row">
            <label for="owner-name">Owner name</label>
            <input type="text" id="owner-name" required>
          </div>
          <div class="form-row">
            <label for="owner-contact">Owner contact</label>
            <input type="text" id="owner-contact" required>
          </div>
        </div>
        <div class="form-row">
          <label for="general-notes">General notes <span class="optional">(optional)</span></label>
          <textarea id="general-notes" rows="2"></textarea>
        </div>
        <div class="record-panel-actions">
          <button type="button" class="btn btn-ghost" id="cancel-new-pet">Cancel</button>
          <button type="submit" class="btn btn-primary">Create profile</button>
        </div>
        <p class="form-status" id="new-pet-status"></p>
      </form>
    </div>

    <!-- Pet detail + records (hidden until a pet is selected) -->
    <div id="pet-detail" class="pet-detail" hidden>
      <button class="btn btn-ghost records-back-btn" id="back-to-list">← Back to all pets</button>

      <div class="pet-detail-head">
        <h2 id="detail-pet-name"></h2>
        <p id="detail-pet-meta" class="dash-view-sub"></p>
      </div>

      <div class="record-panel">
        <h3>Add a record</h3>
        <form id="new-record-form">
          <div class="form-row-grid">
            <div class="form-row">
              <label for="visit-date">Visit date</label>
              <input type="date" id="visit-date" required>
            </div>
          </div>
          <div class="form-row">
            <label for="diagnosis">Diagnosis <span class="optional">(optional)</span></label>
            <textarea id="diagnosis" rows="2"></textarea>
          </div>
          <div class="form-row">
            <label for="treatment">Treatment <span class="optional">(optional)</span></label>
            <textarea id="treatment" rows="2"></textarea>
          </div>
          <div class="form-row">
            <label for="medications">Medications <span class="optional">(optional)</span></label>
            <textarea id="medications" rows="2"></textarea>
          </div>
          <div class="form-row">
            <label for="record-images">Photos <span class="optional">(optional, compressed automatically)</span></label>
            <input type="file" id="record-images" accept="image/*" multiple>
            <p id="image-compress-status" class="image-compress-status"></p>
          </div>
          <button type="submit" class="btn btn-primary" id="record-submit">Save record</button>
          <p class="form-status" id="new-record-status"></p>
        </form>
      </div>

      <h3 class="records-history-heading">History</h3>
      <div id="records-history" class="bookings-list"></div>
      <p id="records-empty" class="dash-empty" hidden>No records yet for this pet.</p>
    </div>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="records.js"></script>
</body>
</html>
